<div *ngIf="product" class="edit-container">

  <h2>Edit {{ product.name }}</h2>

  <form (ngSubmit)="save()" #editForm="ngForm" class="edit-form">

    <label>
      Name:
      <input
        type="text"
        name="name"
        [(ngModel)]="product.name"
        required
        placeholder="Enter product name"
      />
    </label>

    <label>
      Price:
      <input
        type="number"
        name="price"
        [(ngModel)]="product.price"
        required
        min="0"
      />
    </label>

    <!-- ✅ COLOR PICKER -->
    <div class="color-picker">
      <p>Select Colors:</p>

      <div class="colors-container">
        <span
          *ngFor="let clr of allColors"
          class="color-dot"
          [ngStyle]="{ 'background-color': clr }"
          [class.selected]="isSelected(clr)"
          (click)="toggleColor(clr)">
        </span>
      </div>
    </div>

    <button type="submit" [disabled]="editForm.invalid">Save</button>

  </form>
</div>

<!-- Show loading message when no product yet -->
<p *ngIf="!product" class="loading-message">Loading product...</p>
