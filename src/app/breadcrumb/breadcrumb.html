

<!-- Breadcrumb path -->
<h3 class="h3top">
  <a routerLink="/">Home</a>
  /
  <a *ngIf="category" [routerLink]="['/category', category]">
    {{ displayCategory | titlecase }}
  </a>

  <span *ngIf="hasProduct">
    / {{ product }}
  </span>
</h3>

<h2 class="h2top" *ngIf="!product">
  ADIDAS {{ displayCategory | uppercase }}
</h2>
