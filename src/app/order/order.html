<div class="title">
  <h2 class="heading">
    My Cart
    <button class="icon-btn" routerLink="/order-history">
      🧾 Order History
    </button>
  </h2>
</div>

<div class="back-cont">
  <button class="back-btn" (click)="goBack()">← Back</button>
</div>

<p *ngIf="!order" class="empty">
  No orders yet.
</p>

<!-- ✅ SINGLE ORDER CARD -->
<div *ngIf="order" class="order-card">

  <div class="order-header">
    <span>{{ order.date | date:'medium' }}</span>
    <strong>Total: {{ order.total | currency }}</strong>
  </div>

  <!-- ✅ ORDER ITEMS -->
  <div
    class="order-item"
    *ngFor="let item of order.items; let i = index">

    <img
      [src]="item.product.image"
      alt="{{ item.product.name }}"
    />

    <div>
      <p>{{ item.product.name }}</p>

      <small>
        Color:
        <span
          class="color-dot"
          [ngStyle]="{ 'background-color': item.color }">
        </span>
      </small>

      <small>Quantity: {{ item.quantity }}</small>
    </div>

    <span>
      {{ item.product.price * item.quantity | currency }}
    </span>

    <!-- ✅ REMOVE BEFORE CONFIRM -->
    <button
      class="remove-btnn"
      (click)="removeItem(i)">
      Remove
    </button>

  </div>
</div>

<!-- ✅ CONFIRM BUTTON -->
<button
  class="confirm-btn"
  *ngIf="order"
  (click)="confirm()">
  Confirm
</button>
