<app-category-selector></app-category-selector>

<section class="product-grid" >
  <div class="product-card" *ngFor="let product of products">
    <img [src]="product.image" [alt]="product.name" >

   <p class="price">
    {{product.currency}} {{product.price}}
   </p>

   <h4>{{product.name}}</h4>

   <p class="sub">
    {{product.gender | titlecase}}'s Orignals
   </p>

   <p class="colors">
    {{product.colors}} colors
   </p>

   <span class="badge" *ngIf="product.badge">
    {{product.badge}}
   </span>

    <div class="card-actions">
     <button
  type="button"
  class="edit-btn"
  (click)="editProduct(product); $event.stopPropagation()">
  Edit
</button>

<button
  type="button"
  class="delete-btn"
  (click)="deleteProduct(product.id); $event.stopPropagation()">
  Delete
</button>
    </div>

  </div>
</section>
