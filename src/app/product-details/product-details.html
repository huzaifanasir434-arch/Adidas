<app-breadcrumb [category]="category"
  [product]="productName"></app-breadcrumb>

<div class="back-cont">
  <button class="back-btn" (click)="goBack()">← Back</button>
</div>


<div *ngIf="product" class="details-container">


  <!-- IMAGE -->
  <div class="image-section">
    <img [src]="product.image" [alt]="product.name" />
  </div>

  <!-- INFO -->
  <div class="info-section">

    <h2>{{ product.name }}</h2>

    <p class="price">
      {{ product.currency }} {{ product.price }}
    </p>

    <!-- COLORS -->
    <div class="colors">
       <p>Select color:</p>
      <div class="colors-container">
        <span
          *ngFor="let clr of product.colors"
          class="color-dot"
          [ngStyle]="{ 'background-color': clr }"
          [class.selected]="selectedColor === clr"
           [class.active]="clr === selectedColor"
          (click)="selectColor(clr)">
        </span>
      </div>
    </div>

    <!-- QUANTITY -->
    <div class="quantity">
      <p>Quantity:</p>
      <button (click)="decreaseQty()">−</button>
      <span>{{ quantity }}</span>
      <button (click)="increaseQty()">+</button>
    </div>

    <!-- ADD TO CART (future) -->
    <button class="add-to-cart" (click)="addToCart()">
      Add to Cart
    </button>

  </div>
</div>
